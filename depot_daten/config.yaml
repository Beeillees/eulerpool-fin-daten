name: Depot-Daten
version: "0.2.3"
slug: depot_daten
description: Holt täglich Kennzahlen, Kursziele, Analysten, Leerverkäufe, Insider und Termine von Eulerpool für Depot- und Beobachtungstitel.
url: https://github.com/Beeillees/eulerpool-fin-daten
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
services:
  - mqtt:need
map:
  - share:rw
  - homeassistant_config:ro
options:
  token: ""
  uhrzeit: "05:00"
  monatslimit: 100000
  isin_zuordnung: []
  log_level: info
schema:
  token: password?
  uhrzeit: match(^([01]\d|2[0-3]):[0-5]\d$)
  monatslimit: int(100,100000000)
  isin_zuordnung:
    - match(^[A-Z0-9.\-^=]+=[A-Z]{2}[A-Z0-9]{9}\d$)
  log_level: list(debug|info|warning)
